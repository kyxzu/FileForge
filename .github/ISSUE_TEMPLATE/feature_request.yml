name: Feature request
description: Suggest an improvement or a new tool
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and what is difficult today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like FileForge to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This can work entirely in the browser, without uploading files or collecting data (or any external request would be opt-in).
          required: true
