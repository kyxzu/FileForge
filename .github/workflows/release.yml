# Builds the FileForge desktop installers (Tauri) and an Android APK (Capacitor)
# and attaches them to a DRAFT GitHub Release. Nothing is published until the
# repository owner reviews the draft and clicks "Publish release".
#
# Trigger: push a tag such as v0.1.0, or run it by hand from the Actions tab.
name: Build native apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build libraries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Installers are unsigned unless signing secrets are added later, so
      # Windows SmartScreen and macOS Gatekeeper will warn on first launch.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: FileForge ${{ github.ref_name }}
          releaseBody: See the assets below. These builds are unsigned.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      # A debug-signed APK can be sideloaded on any device. A Play Store build
      # needs the owner's own release keystore (not part of this repository).
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FileForge-android-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FileForge-android-debug
          path: FileForge-android-debug.apk

      - name: Attach APK to the draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 \
            || gh release create "${{ github.ref_name }}" --draft --title "FileForge ${{ github.ref_name }}" --notes "See the assets below. These builds are unsigned or debug-signed."
          gh release upload "${{ github.ref_name }}" FileForge-android-debug.apk --clobber
