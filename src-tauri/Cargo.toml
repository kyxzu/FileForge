[package]
name = "fileforge"
version = "1.1.0"
description = "Private image tools that run on your device"
authors = ["kyxzu"]
repository = "https://github.com/kyxzu/FileForge"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "fileforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
